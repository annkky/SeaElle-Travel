<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Оплата прошла успешно — SeaElle Travel</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    .result-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 20px 60px;
      background:
        linear-gradient(180deg, rgba(26,18,8,0.75), rgba(26,18,8,0.55)),
        url('images/hero.jpg') center/cover no-repeat fixed;
    }

    .result-card {
      background: var(--milk);
      border: 1px solid var(--sand);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      max-width: 480px;
      width: 100%;
      padding: 56px 48px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .result-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(to right, var(--gold-dark), var(--gold-light), var(--gold-dark));
    }

    .result-icon {
      width: 84px;
      height: 84px;
      background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      box-shadow: 0 10px 32px rgba(201, 168, 76, 0.4), inset 0 1px 0 rgba(255,255,255,0.35);
      animation: popIn 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }

    @keyframes popIn {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    .result-eyebrow {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
    }

    .result-title {
      font-family: var(--font-serif);
      font-size: 2.1rem;
      font-weight: 400;
      color: var(--text-dark);
      line-height: 1.2;
      margin-bottom: 14px;
    }

    .result-title em {
      font-style: italic;
      color: var(--gold-dark);
    }

    .result-text {
      font-family: var(--font-sans);
      color: var(--text-mid);
      font-size: 0.95rem;
      line-height: 1.75;
      margin-bottom: 32px;
    }

    .result-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-primary,
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-secondary {
      padding: 13px 28px;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-mid);
      background: transparent;
      border: 1.5px solid var(--sand-dark);
      border-radius: 4px;
      transition: all var(--transition);
    }

    .btn-secondary:hover {
      border-color: var(--gold);
      color: var(--gold-dark);
      background: rgba(201, 168, 76, 0.06);
    }

    .result-contacts {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--sand);
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 0.92rem;
      color: var(--text-light);
    }

    .result-contacts a {
      color: var(--gold-dark);
      font-style: normal;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      transition: color var(--transition);
    }

    .result-contacts a:hover { color: var(--gold); }

    @media (max-width: 560px) {
      .result-card { padding: 40px 28px 36px; }
      .result-title { font-size: 1.7rem; }
    }
  </style>
</head>
<body>

  <main class="result-page">
    <div class="result-card">
      <!-- Иконка успеха -->
      <div class="result-icon" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>

      <p class="result-eyebrow">SeaElle Travel</p>
      <h1 class="result-title">Оплата <em>прошла</em></h1>
      <p class="result-text">
        Спасибо! Ваш платёж успешно обработан.<br />
        Наш консьерж свяжется с вами в ближайшее время для подтверждения деталей путешествия.
      </p>

      <div class="result-actions">
        <a href="index.html#destinations" class="btn-primary">
          Смотреть направления
        </a>
        <a href="index.html" class="btn-secondary">На главную</a>
      </div>

      <div class="result-contacts">
        Вопросы? Свяжитесь с нами:
        <br />
        <a href="mailto:seaelletravel@gmail.com">seaelletravel@gmail.com</a> ·
        <a href="tel:+998900220015">+998 90 022 00 15</a>
      </div>
    </div>
  </main>
</body>
</html>
