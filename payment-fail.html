<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ошибка оплаты — SeaElle Travel</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    .result-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 20px 60px;
      background:
        linear-gradient(180deg, rgba(26,18,8,0.75), rgba(26,18,8,0.55)),
        url('images/hero.jpg') center/cover no-repeat fixed;
    }

    .result-card {
      background: var(--milk);
      border: 1px solid var(--sand);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      max-width: 480px;
      width: 100%;
      padding: 56px 48px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .result-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(to right, #c95846, #e57461, #c95846);
    }

    .result-icon {
      width: 84px;
      height: 84px;
      background: linear-gradient(135deg, #e57461, #c95846, #a8412f);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      box-shadow: 0 10px 32px rgba(201, 88, 70, 0.4), inset 0 1px 0 rgba(255,255,255,0.3);
      animation: popIn 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }

    @keyframes popIn {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    .result-eyebrow {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
    }

    .result-title {
      font-family: var(--font-serif);
      font-size: 2.1rem;
      font-weight: 400;
      color: var(--text-dark);
      line-height: 1.2;
      margin-bottom: 14px;
    }

    .result-title em {
      font-style: italic;
      color: #b54a3a;
    }

    .result-text {
      font-family: var(--font-sans);
      color: var(--text-mid);
      font-size: 0.95rem;
      line-height: 1.75;
      margin-bottom: 18px;
    }

    /* Блок с сообщением об ошибке из URL-параметра */
    .error-message {
      background: #fff5f2;
      border: 1px solid #e9c2b8;
      border-left: 3px solid #c95846;
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      font-family: var(--font-sans);
      font-size: 0.86rem;
      color: #8c3825;
      margin-bottom: 28px;
      text-align: left;
      display: none; /* показываем через JS если есть ?msg= */
    }

    .result-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-primary,
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-secondary {
      padding: 13px 28px;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-mid);
      background: transparent;
      border: 1.5px solid var(--sand-dark);
      border-radius: 4px;
      transition: all var(--transition);
    }

    .btn-secondary:hover {
      border-color: var(--gold);
      color: var(--gold-dark);
      background: rgba(201, 168, 76, 0.06);
    }

    .result-contacts {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--sand);
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 0.92rem;
      color: var(--text-light);
    }

    .result-contacts a {
      color: var(--gold-dark);
      font-style: normal;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      transition: color var(--transition);
    }

    .result-contacts a:hover { color: var(--gold); }

    @media (max-width: 560px) {
      .result-card { padding: 40px 28px 36px; }
      .result-title { font-size: 1.7rem; }
    }
  </style>
</head>
<body>

  <main class="result-page">
    <div class="result-card">
      <!-- Иконка ошибки -->
      <div class="result-icon" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </div>

      <p class="result-eyebrow">SeaElle Travel</p>
      <h1 class="result-title">Оплата <em>не прошла</em></h1>
      <p class="result-text">
        К сожалению, платёж не был завершён.<br />
        Вы можете попробовать ещё раз или связаться с нами.
      </p>

      <!-- Детали ошибки (если переданы через ?msg=) -->
      <div class="error-message" id="errorMsg"></div>

      <div class="result-actions">
        <a href="payment.html" class="btn-primary">
          Попробовать снова
        </a>
        <a href="index.html" class="btn-secondary">На главную</a>
      </div>

      <div class="result-contacts">
        Нужна помощь? Обратитесь к консьержу:
        <br />
        <a href="mailto:seaelletravel@gmail.com">seaelletravel@gmail.com</a> ·
        <a href="tel:+998900220015">+998 90 022 00 15</a>
      </div>
    </div>
  </main>

  <script>
    // Показываем сообщение об ошибке из URL-параметра ?msg=
    const params = new URLSearchParams(window.location.search);
    const msg = params.get('msg');
    if (msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = decodeURIComponent(msg);
      el.style.display = 'block';
    }
  </script>
</body>
</html>
